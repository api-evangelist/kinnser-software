name: Kinnser Software
description: 'Kinnser Software was an Austin, Texas-based provider of cloud, web-based
  software for the post-acute care industry, serving home health, hospice, private
  duty / personal care, and outpatient therapy agencies. Its flagship product, Kinnser
  Agency Manager, handled clinical documentation, scheduling, billing, OASIS assessments,
  and regulatory compliance for home-based care providers. Founded in 2003 by Chris
  Hester, the company took growth investment from Insight Partners (Insight Venture
  Partners) in 2012, was acquired by Mediware Information Systems in December 2016,
  and its products were folded into WellSky after Mediware rebranded as WellSky in
  2017. The kinnser.com domain now redirects to wellsky.com; there is no independent
  Kinnser public developer portal or API surface. This record is a portfolio-lead
  stub retained in the API Evangelist network for lineage and enrichment.'
